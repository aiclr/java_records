# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/platforms.html#sub::toml-dependencies-format
[versions]
logback-classic = "1.5.19"
lombok = "1.18.38"
commons-lang3 = "3.18.0"
commons-text = "1.14.0"
gson = "2.13.0"
guava = "33.4.8-jre"
js = "24.2.1"
jsScriptengine = "24.2.1"
# junit5
junitJupiter = "5.13.2"
# junit3/4
junit = "4.13"

[libraries]
logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback-classic" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
commonsLang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }
commonsText = { module = "org.apache.commons:commons-text", version.ref = "commons-text" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
# https://mvnrepository.com/artifact/com.google.guava/guava/
guava = { module = "com.google.guava:guava", version.ref = "guava" }

# https://mvnrepository.com/artifact/org.graalvm.js/js
js = { module = "org.graalvm.js:js", version.ref = "js" }
# https://mvnrepository.com/artifact/org.graalvm.js/js-scriptengine
jsScriptengine = { module = "org.graalvm.js:js-scriptengine", version.ref = "jsScriptengine" }

# https://docs.gradle.org/8.14.3/userguide/java_testing.html#using_junit5
junitJupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junitJupiter" }
junitPlatformLauncher = { module = "org.junit.platform:junit-platform-launcher" }
## junit5 run junit3/4
junit = { module = "junit:junit", version.ref = "junit" }
junitVintageEngine = { module = "org.junit.vintage:junit-vintage-engine" }
