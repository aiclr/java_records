plugins {
    // Apply the groovy Plugin to add support for Groovy.
    id 'groovy'
}

group = 'cn.aiclr.design'
version = '1.0.0-SNAPSHOT'

repositories {
    flatDir { dirs('libs') }
    mavenLocal()
    // 阿里云镜像 (推荐)
    maven { url = 'https://maven.aliyun.com/repository/public' }
    // 阿里云Google仓库（Android项目必需）
    maven { url = 'https://maven.aliyun.com/repository/google' }
    // 阿里云Spring仓库（Spring项目可选）
    maven { url = 'https://maven.aliyun.com/repository/spring' }
    // 腾讯云镜像 (备选)
    maven { url = 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public' }
    // 华为云镜像 (备选)
    maven { url = 'https://repo.huaweicloud.com/repository/maven' }
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    implementation(libs.logback)
    // Use the latest Groovy version for building this library
    implementation(libs.groovy)
    implementation(libs.groovySql)
    // @Grab 需要 apache ivy
    implementation(libs.ivy)

    // Use the awesome Spock testing and specification framework even with Java
    testImplementation(libs.spock.core)
    testImplementation(libs.junit4)
}

// https://docs.gradle.org/8.14.3/javadoc/org/gradle/api/tasks/testing/Test.html#useJUnitPlatform
test {
    useJUnitPlatform()
    systemProperty('junit.jupiter.execution.parallel.enabled', 'true')
    systemProperty('junit.jupiter.execution.parallel.mode.default', 'concurrent')
    maxParallelForks = Runtime.getRuntime().availableProcessors() / 2 as int

    // explicitly include or exclude tests
//    include 'org/foo/**'
//    exclude 'org/boo/**'

    // show standard out and standard error of the test JVM(s) on the console
//    testLogging.showStandardStreams = true

    // set heap size for the test JVM(s)
//    minHeapSize = "128m"
//    maxHeapSize = "512m"

    // set JVM arguments for the test JVM(s)
//    jvmArgs('-XX:MaxPermSize=256m')

    // listen to events in the test execution lifecycle
//    beforeTest { descriptor ->
//        logger.lifecycle("Running test: " + descriptor)
//    }

    // fail the 'test' task on the first test failure
//    failFast = true

    // skip an actual test execution
//    dryRun = true

    // listen to standard out and standard error of the test JVM(s)
//    onOutput { descriptor, event ->
//        logger.lifecycle("Test: " + descriptor + " produced standard out/err: " + event.message )
//    }
}